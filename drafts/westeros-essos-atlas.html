<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نقشه جهان شناخته‌شده | وستروس و اسوس</title>
<style>
:root{--ink:#302719;--paper:#ead9ae;--sea:#a9c4bd;--gold:#9a7138}
*{box-sizing:border-box}body{margin:0;background:#211f1a;color:#f2e6c9;font-family:Tahoma,"Segoe UI",sans-serif}
header{padding:18px 22px 12px;text-align:center}h1{margin:0;font-family:Georgia,serif;letter-spacing:2px;font-size:clamp(22px,4vw,38px);color:#e9d6a8}
header p{margin:8px 0 0;color:#c9b990;font-size:13px}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px 14px}
button{border:1px solid #9b8257;background:#403727;color:#f4e5c1;padding:9px 14px;border-radius:20px;cursor:pointer;font:inherit;font-size:12px}
button.active{background:#b28a4b;color:#201a11;border-color:#e4c98c}
.frame{max-width:1500px;margin:0 auto 22px;padding:0 12px}
.mapwrap{overflow:hidden;border:8px solid #55452e;border-radius:8px;background:#b5c8bd;box-shadow:0 18px 60px #0009}
svg{display:block;width:100%;height:auto;touch-action:pan-x pan-y}
.land{fill:#dfc99a;stroke:#786343;stroke-width:4;stroke-linejoin:round}
.land2{fill:#d6c08d;stroke:#786343;stroke-width:4;stroke-linejoin:round}
.island{fill:#ddc794;stroke:#786343;stroke-width:2}
.coastline{fill:none;stroke:#f0dfb8;stroke-width:2;opacity:.85}
.region{font: bold 22px Georgia,serif;letter-spacing:2px;fill:#786343;opacity:.82;text-anchor:middle}
.smallregion{font:italic 15px Georgia,serif;fill:#88734f;text-anchor:middle}
.sealabel{font:italic 23px Georgia,serif;fill:#557b79;letter-spacing:2px;text-anchor:middle}
.place{font: bold 14px Tahoma,sans-serif;fill:#35291c;paint-order:stroke;stroke:#ead9ae;stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.minor{font:12px Tahoma,sans-serif;fill:#493923;paint-order:stroke;stroke:#ead9ae;stroke-width:3px;text-anchor:middle}
.dot{fill:#783d2c;stroke:#f2dfb5;stroke-width:2}
.capital{fill:#a13d2e;stroke:#f6e6c6;stroke-width:3}
.river{fill:none;stroke:#6e9d9a;stroke-width:4;stroke-linecap:round}
.mountain{fill:#88775a;stroke:#5e503b;stroke-width:1.5}
.forest{fill:#687a51;stroke:#43553a;stroke-width:1}
.wall{stroke:#d7d1bd;stroke-width:9;stroke-linecap:round;stroke-dasharray:4 3}
.route{fill:none;stroke:#a06a3d;stroke-width:2;stroke-dasharray:7 7;opacity:.75}
.hidden{display:none}
.legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding:12px;color:#cdbd98;font-size:12px}
.note{text-align:center;color:#b9a985;font-size:11px;padding:0 15px 24px}
</style>
</head>
<body>
<header><h1>THE KNOWN WORLD</h1><p>وستروس و اسوس · پیش‌نویس مستقل نقشه جهان شناخته‌شده</p></header>
<div class="toolbar">
<button class="active" data-layer="names">نام مناطق</button>
<button class="active" data-layer="cities">شهرها و دژها</button>
<button class="active" data-layer="terrain">عوارض طبیعی</button>

<div class="legend"><span>● شهر یا دژ مهم</span><span>▲ رشته‌کوه</span><span>خط آبی: رودخانه</span><span>خط‌چین سفید: دیوار</span></div>
</div>
<div class="note">این یک نقشه شماتیک و پیش‌نویس طراحی مستقل است؛ فاصله‌ها و مرزها برای نمایش استراتژیک تقریبی‌اند، نه مقیاس جغرافیایی دقیق. هنوز به بازی متصل نشده است.</div>
<script>
document.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',()=>{const el=document.getElementById(b.dataset.layer);el.classList.toggle('hidden');b.classList.toggle('active')}));
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('[data-layer]').forEach(b=>{document.getElementById(b.dataset.layer).classList.remove('hidden');b.classList.add('active')});document.getElementById('map').setAttribute('viewBox','0 0 1600 1000')});
</script>
</body></html>
